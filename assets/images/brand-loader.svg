<?xml version="1.0" encoding="UTF-8"?>
<!--
  Noir Corset — animated brand mark (corset panel + spiral lace + eyelets).
  Self-contained: works dropped straight into an <img src="..."> (animations
  still run, since browsers animate SMIL/CSS inside <img>-embedded SVGs) or
  inlined directly in HTML for full control from an external stylesheet.
  Colors are hard-coded here (rather than currentColor) since a standalone
  file has no host page CSS variables to inherit from.
-->
<svg viewBox="0 0 120 140" width="120" height="140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Noir Corset loading mark">
  <title>Noir Corset</title>

  <!-- corset front panel outline, draws itself in -->
  <path d="M20 2 L100 2 C106 2 110 4.5 110 8 L110 132 C110 135.5 106 138 100 138 L20 138 C14 138 10 135.5 10 132 L10 8 C10 4.5 14 2 20 2 Z"
        stroke="#F6F1E9" stroke-width="1.4" opacity="0.55"
        stroke-dasharray="470" stroke-dashoffset="470">
    <animate attributeName="stroke-dashoffset" from="470" to="0" begin="0.06s" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </path>

  <!-- spiral lace, threads through the eyelets -->
  <path d="M30 20 L90 40 L30 60 L90 80 L30 100 L90 120"
        stroke="#F6F1E9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="330" stroke-dashoffset="330">
    <animate attributeName="stroke-dashoffset" from="330" to="0" begin="0.52s" dur="0.65s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </path>

  <!-- brass eyelets, pop in as the lace passes each one -->
  <g fill="#A9772F">
    <circle cx="30" cy="20" r="4.2" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" begin="0.52s" dur="0.42s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.2;1.35;1" keyTimes="0;0.6;1" begin="0.52s" dur="0.42s" fill="freeze"/>
    </circle>
    <circle cx="90" cy="40" r="4.2" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" begin="0.65s" dur="0.42s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.2;1.35;1" keyTimes="0;0.6;1" begin="0.65s" dur="0.42s" fill="freeze"/>
    </circle>
    <circle cx="30" cy="60" r="4.2" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" begin="0.78s" dur="0.42s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.2;1.35;1" keyTimes="0;0.6;1" begin="0.78s" dur="0.42s" fill="freeze"/>
    </circle>
    <circle cx="90" cy="80" r="4.2" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" begin="0.91s" dur="0.42s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.2;1.35;1" keyTimes="0;0.6;1" begin="0.91s" dur="0.42s" fill="freeze"/>
    </circle>
    <circle cx="30" cy="100" r="4.2" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" begin="1.04s" dur="0.42s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.2;1.35;1" keyTimes="0;0.6;1" begin="1.04s" dur="0.42s" fill="freeze"/>
    </circle>
    <circle cx="90" cy="120" r="4.2" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" begin="1.17s" dur="0.42s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="0.2;1.35;1" keyTimes="0;0.6;1" begin="1.17s" dur="0.42s" fill="freeze"/>
    </circle>
  </g>
</svg>
